<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Literature Analytics</title>
<meta name="description" content="An analytics workspace over classic novels and their authors: sentiment momentum, genre mutations, influence, and prose similarity.">
<link rel="stylesheet" href="app.css">
<link rel="preload" href="data/genres.json" as="fetch" crossorigin>
<link rel="preload" href="data/sentiment.json" as="fetch" crossorigin>
<script id="ec" async src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>Classic Literature</span></div>
    <form class="ask" id="ask" autocomplete="off">
      <input id="askq" name="q" type="text" placeholder="Ask a question about the data" aria-label="Ask a question about the data" maxlength="300">
      <button type="submit">Ask</button>
    </form>
    <button class="icon-btn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark">◐</button>
  </header>
  <div class="chips" id="chips"></div>
  <div class="answer" id="answer" hidden></div>
  <nav class="rail" id="rail" aria-label="Report pages"></nav>
  <main class="main">
    <div class="ptitle" id="ptitle"></div>
    <div class="mbar">
      <button class="ghost" id="mfilters" type="button">Filters</button>
      <button class="story-btn" id="mstory" type="button">▶ Story</button>
    </div>
    <div class="slicers" id="slicers">
      <div class="sheet-head"><b>Filters</b><button class="ghost" id="sdone" type="button">Done</button></div>
      <label>Author<select id="f-author"></select></label>
      <label>Work<select id="f-work"></select></label>
      <label>Genre<select id="f-genre"></select></label>
      <label>From<select id="f-from"></select></label>
      <label>To<select id="f-to"></select></label>
      <button class="ghost" id="clear" type="button">Clear</button>
      <button class="story-btn" id="story" type="button">▶ Story</button>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <section class="page" id="page"></section>
    <footer class="foot" id="foot"></footer>
  </main>
  <div class="scrim-f" id="scrim-f" hidden></div>
  <div class="storybar" id="storybar" hidden>
    <div class="story-prog"><i id="story-prog"></i></div>
    <div class="story-step" id="story-step"></div>
    <div class="story-text" id="story-text"></div>
    <div class="story-nav">
      <button class="ghost" id="story-back" type="button">Back</button>
      <span id="story-count"></span>
      <button id="story-next" type="button">Next</button>
      <button class="ghost" id="story-close" type="button" aria-label="Close story">✕</button>
    </div>
  </div>
</div>
<script src="ask-local.js" defer></script>
<script src="chips.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
